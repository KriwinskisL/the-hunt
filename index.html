  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<body>

<main id="start">
  <h1>The<span>Hunt</span></h1>
  <p class="lead">Die Schatten fliehen, alle anderen jagen. Gebt alle denselben Spielcode ein, um im selben Spiel zu landen.</p>
  <div class="feld">
    <label for="name">Dein Name</label>
    <input id="name" autocomplete="nickname" placeholder="z. B. Lena" maxlength="20">
  </div>
  <div class="feld">
    <label for="code">Spielcode</label>
    <input id="code" autocapitalize="none" autocorrect="off" placeholder="z. B. jagd1" maxlength="30">
  </div>
  <div class="feld">
    <label>Deine Rolle</label>
    <div class="rollen">
      <button class="rolle" data-rolle="jaeger" aria-pressed="true"><b>🔎 Jäger</b><small>Siehst die Pings und die anderen Jäger</small></button>
      <button class="rolle" data-rolle="schatten" aria-pressed="false"><b id="schattenTitel">🌑 Schatten</b><small>Flieh 90 Minuten lang, ohne gefasst zu werden</small></button>
    </div>
  </div>
  <p id="startFehler" role="alert"></p>
  <button id="los">Spiel beitreten</button>
</main>

<section id="spiel">
  <div id="map"></div>
  <button class="fab" id="fabMich" aria-label="Karte auf mich zentrieren">◎</button>
  <div id="toasts" aria-live="polite"></div>
  <div id="hinweis"></div>
  <div id="panel">
    <div id="kopf"><span id="wer"></span><span id="uhr">–</span></div>
    <div id="infos"></div>
    <button id="pushKnopf" hidden></button>
    <div class="knoepfe" id="knoepfe"></div>
    <div class="knoepfe" id="funkzeile">
      <button id="chatKnopf" class="grau" hidden>💬 Chat</button>
      <button id="funkKnopf" class="funk" hidden>🎙️ Halten zum Funken</button>
    </div>
  </div>
</section>

<div id="modal" hidden><div id="modalInhalt" role="dialog" aria-modal="true"></div></div>

<script>
// =====================================================================
// Einstellungen – hier kannst du die Spielregeln anpassen
// =====================================================================
const SUPABASE_URL = 'https://pgrjysyyubkhykwjsath.supabase.co';
const SUPABASE_KEY = 'sb_publishable_d8Uxjl4pCXvfooQFijRBuw_UY6QfKE1';

const FLUCHT = { name: 'Schatten', emoji: '🌑', der: 'der Schatten', Der: 'Der Schatten' };  // Name der fliehenden Person
const SPIELDAUER_MIN = 90;      // Gesamtdauer ab Spielstart
const VORSPRUNG_MIN = 7.5;      // Vorsprung, danach kommt der erste Ping (7:30)
const PING_ABSTAND_MIN = 7.5;   // 7:30 Minuten zwischen zwei Pings
const RAETSEL_MIN = [30, 60];   // Zeitpunkte der Rätsel
const RAETSEL_DAUER_S = 180;    // Zeit zum Antworten
const AUFDECKEN_MIN = [30, 60]; // Zeitpunkte, an denen der Schatten die Jäger einmal sieht
// Zone schrumpft um ihre Mitte: Faktor bezogen auf die ursprüngliche Größe (0.8 = 80 % Breite/Höhe)
const SCHRUMPF = [{ min: 60, faktor: 0.8 }, { min: 75, faktor: 0.6 }];
const STRAFE_S = 60;            // Schatten bleibt nach Rückkehr in die Zone so lange live sichtbar
const FUNK_MAX_S = 30;          // Längste Funk-Nachricht
const JOKER_RADIUS_M = 1000;    // Falscher Ping höchstens so weit von der echten Position
const SYNC_S = 4;               // Abgleich mit dem Server
const SPUR_S = 20;              // Wie oft die Route der Schatten gespeichert wird
const SCHATTEN_FARBEN = ['#e0482f', '#9333ea', '#d97706', '#db2777', '#0d9488', '#4b5563']; // eine Farbe pro Schatten
const JAEGER_TIMEOUT_S = 120;   // Jäger ohne Update gelten danach als offline

const RAETSEL = [
  { frage: 'Wann erfand Albert Einstein die Glühbirne?', antworten: ['1950', '2015', 'nie', '1879'], richtig: 'nie' },
  { frage: 'Was war vor der Entdeckung des Mount Everest der höchste Berg der Welt?', antworten: ['K2', 'Mount Everest', 'Zugspitze', 'Kilimandscharo'], richtig: 'Mount Everest' },
  { frage: 'Wie viele Monate haben 28 Tage?', antworten: ['1', '2', '6', '12'], richtig: '12' },
  { frage: 'Ein Bauer hat 17 Schafe. Alle bis auf 9 sterben. Wie viele bleiben übrig?', antworten: ['8', '9', '17', '0'], richtig: '9' },
  { frage: 'Welche Farbe hat die Blackbox in einem Flugzeug?', antworten: ['Schwarz', 'Orange', 'Gelb', 'Silber'], richtig: 'Orange' },
  { frage: 'Wie lange dauerte der Hundertjährige Krieg?', antworten: ['100 Jahre', '116 Jahre', '99 Jahre', '87 Jahre'], richtig: '116 Jahre' },
  { frage: 'Aus welchem Land stammen Panamahüte ursprünglich?', antworten: ['Panama', 'Ecuador', 'Kolumbien', 'Mexiko'], richtig: 'Ecuador' },

  { frage: 'Was ist schwerer: ein Kilo Federn oder ein Kilo Eisen?', antworten: ['Federn', 'Eisen', 'Gleich schwer', 'Kommt aufs Wetter an'], richtig: 'Gleich schwer' },
  { frage: 'Welches ist das größte Organ des Menschen?', antworten: ['Leber', 'Haut', 'Lunge', 'Darm'], richtig: 'Haut' },
  { frage: 'Wie viele Ecken hat ein Würfel?', antworten: ['6', '8', '12', '4'], richtig: '8' },
  { frage: 'Welcher Planet ist der Sonne am nächsten?', antworten: ['Venus', 'Merkur', 'Mars', 'Erde'], richtig: 'Merkur' }
];

// Öffentlicher Push-Schlüssel (der private steckt nur in der Supabase-Funktion)
const VAPID_PUBLIC = 'BIzMfa_kAmFV9RLW26p47mtD32NHLESNJRc5ekuATs_xP5-EnvP6aU0cVxC_2Umydh99eNPcQmynoOCgYECex68';

// =====================================================================
// Push-Benachrichtigungen
// =====================================================================
const istIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
const istHomescreen = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const pushMoeglich = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
let swReg = null;
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(r => { swReg = r; }).catch(e => console.warn('Service Worker', e));
}
function pushStatus() {
  if (!pushMoeglich) return (istIOS && !istHomescreen) ? 'homescreen' : 'nein';
  if (Notification.permission === 'granted') return 'an';
  if (Notification.permission === 'denied') return 'blockiert';
  return 'aus';
}
function base64ZuBytes(b64) {
  const pad = '='.repeat((4 - b64.length % 4) % 4);
  const roh = atob((b64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from([...roh].map(c => c.charCodeAt(0)));
}
async function pushAboSpeichern() {
  const reg = swReg || await navigator.serviceWorker.ready;
  let abo = await reg.pushManager.getSubscription();
  if (!abo) abo = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: base64ZuBytes(VAPID_PUBLIC) });
  const j = abo.toJSON();
  await dbUpsert('push_abos', { endpoint: j.endpoint, spiel: s.code, name: s.name, rolle: s.rolle, abo: j, aktualisiert: iso() }, 'endpoint');
}
async function pushAktivieren() {
  try {
    const erlaubnis = await Notification.requestPermission();
    if (erlaubnis !== 'granted') { toast('Benachrichtigungen wurden nicht erlaubt', true); }
    else { await pushAboSpeichern(); toast('Benachrichtigungen sind an'); }
  } catch (e) {
    console.warn(e);
    toast('Benachrichtigungen konnten nicht aktiviert werden', true);
  }
  render();
}
function renderPushKnopf() {
  const k = $('pushKnopf');
  const st = pushStatus();
  if (s.pushVersteckt || st === 'an' || st === 'nein') { k.hidden = true; return; }
  k.hidden = false;
  if (st === 'aus') {
    k.textContent = '🔔 Benachrichtigungen aktivieren – damit du Pings auch bei gesperrtem Handy mitbekommst';
    k.onclick = pushAktivieren;
  } else if (st === 'homescreen') {
    k.textContent = '🔔 Für Benachrichtigungen: unten auf Teilen → „Zum Home-Bildschirm“, dann The Hunt von dort öffnen. (Tippen zum Ausblenden)';
    k.onclick = () => { s.pushVersteckt = true; render(); };
  } else {
    k.textContent = '🔕 Benachrichtigungen sind blockiert – in den Einstellungen unter Mitteilungen erlauben. (Tippen zum Ausblenden)';
    k.onclick = () => { s.pushVersteckt = true; render(); };
  }
}

// =====================================================================
// Hilfsfunktionen
// =====================================================================
const MIN = 60000;
const $ = (id) => document.getElementById(id);
const jetzt = () => Date.now();
const iso = (ms = jetzt()) => new Date(ms).toISOString();
const uhr = (ms) => new Date(ms).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
function mmss(ms) { const sek = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(sek / 60) + ':' + String(sek % 60).padStart(2, '0'); }
function esc(t) { return String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

function abstandM([lat1, lng1], [lat2, lng2]) {
  const r = 6371000, rad = Math.PI / 180;
  const a = Math.sin((lat2 - lat1) * rad / 2) ** 2 + Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin((lng2 - lng1) * rad / 2) ** 2;
  return 2 * r * Math.asin(Math.sqrt(a));
}
function punktInPolygon([y, x], poly) {
  let drin = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [yi, xi] = poly[i], [yj, xj] = poly[j];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) drin = !drin;
  }
  return drin;
}
function geschrumpft(zone, faktor) {
  const cy = zone.reduce((a, p) => a + p[0], 0) / zone.length;
  const cx = zone.reduce((a, p) => a + p[1], 0) / zone.length;
  return zone.map(([y, x]) => [cy + (y - cy) * faktor, cx + (x - cx) * faktor]);
}
function zufaelligeIndizes(anzahl, n) {
  const a = [...Array(anzahl).keys()];
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a.slice(0, n);
}

// =====================================================================
// Server (Supabase)
// =====================================================================
const HEADERS = { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' };
async function anfrage(methode, pfad, body, extra = {}) {
  const r = await fetch(SUPABASE_URL + '/rest/v1/' + pfad, {
    method: methode, headers: { ...HEADERS, ...extra }, body: body !== undefined ? JSON.stringify(body) : undefined
  });
  if (!r.ok) throw new Error(pfad + ' ' + r.status + ' ' + await r.text());
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}
const qs = (o) => new URLSearchParams(o).toString();
const dbGet = (t, p) => anfrage('GET', t + '?' + qs(p));
const dbInsert = (t, d) => anfrage('POST', t, d);
const dbUpsert = (t, d, konflikt) => anfrage('POST', t + '?on_conflict=' + konflikt, d, { Prefer: 'resolution=merge-duplicates' });
const dbInsertIgnorieren = (t, d, konflikt) => anfrage('POST', t + '?on_conflict=' + konflikt, d, { Prefer: 'resolution=ignore-duplicates,return=representation' });
const dbPatch = (t, p, d) => anfrage('PATCH', t + '?' + qs(p), d, { Prefer: 'return=representation' });
const dbDelete = (t, p) => anfrage('DELETE', t + '?' + qs(p));

// =====================================================================
// Zustand
// =====================================================================
const s = {
  name: '', code: '', rolle: 'jaeger',
  position: null, zentriert: false, gpsFehler: null, online: true,
  spiel: null, zoneLokal: [], zeichnen: false, zoneSperreBis: 0,
  pings: [], spieler: [], belohnungen: [], meineRunden: new Set(),
  ersterSync: true, gemeldet: new Set(), ausgewertet: new Set(),
  jokerModus: false, aufdeckung: null, modalTyp: null, raetselEnde: 0,
  letzteSpur: 0, fangAbgelehnt: null, knopfSchluessel: '', pushVersteckt: false,
  chat: [], chatLetzteId: 0, chatGelesen: 0, strafeBis: 0, strafeAktiv: false, funkAn: false, funkGedrueckt: false
};
const meinKanal = () => istSchatten() ? 'schatten' : 'jaeger';
const chatMoeglich = () => !istSchatten() || (mehrereSchatten() && !binGefasst());
const istSchatten = () => s.rolle === 'schatten';

function startMs() { return s.spiel && s.spiel.start ? Date.parse(s.spiel.start) : null; }
function endeMs() { const st = startMs(); return st == null ? null : st + SPIELDAUER_MIN * MIN; }
function phase() {
  if (!s.spiel || !s.spiel.start || s.spiel.status === 'warten') return 'lobby';
  if (s.spiel.status === 'gefasst' || s.spiel.status === 'entkommen' || jetzt() >= endeMs()) return 'ende';
  return 'laeuft';
}
function pingZeit(k) { return startMs() + (VORSPRUNG_MIN + k * PING_ABSTAND_MIN) * MIN; }
function naechsterPingNr() {
  for (let k = 0; k < 1000; k++) { const t = pingZeit(k); if (t >= endeMs()) return null; if (t > jetzt()) return k; }
  return null;
}
function faelligePingNrs() {
  const r = [];
  for (let k = 0; k < 1000; k++) { const t = pingZeit(k); if (t >= endeMs() || t > jetzt()) break; r.push(k); }
  return r;
}
function zonenFaktor() {
  if (phase() === 'lobby' || !startMs()) return 1;
  let f = 1;
  SCHRUMPF.forEach(st => { if (jetzt() >= startMs() + st.min * MIN) f = st.faktor; });
  return f;
}
function aktuelleZone() { const z = s.zoneLokal, f = zonenFaktor(); return (z.length >= 3 && f < 1) ? geschrumpft(z, f) : z; }
const hatZone = () => aktuelleZone().length >= 3;
const binDraussen = () => phase() === 'laeuft' && hatZone() && s.position && !punktInPolygon(s.position, aktuelleZone());
// Jäger außerhalb der Zone: keine Pings, keine anderen Jäger, kein Funk
const jaegerGesperrt = () => !istSchatten() && binDraussen();
const unterStrafe = (p) => p.rolle === 'schatten' && !p.gefasst && p.strafe_bis && Date.parse(p.strafe_bis) > jetzt();
const vorsprungText = () => mmss(VORSPRUNG_MIN * MIN);
function jaegerOnline() {
  return s.spieler.filter(p => p.rolle === 'jaeger' && Date.parse(p.aktualisiert) >= jetzt() - JAEGER_TIMEOUT_S * 1000);
}
const alleSchatten = () => s.spieler.filter(p => p.rolle === 'schatten').sort((a, b) => a.name.localeCompare(b.name));
const freieSchatten = () => alleSchatten().filter(p => !p.gefasst);
const mehrereSchatten = () => alleSchatten().length > 1;
const meinEintrag = () => s.spieler.find(p => p.name === s.name);
const binGefasst = () => istSchatten() && !!(meinEintrag() && meinEintrag().gefasst);
function farbe(name) {
  const i = alleSchatten().findIndex(p => p.name === name);
  return SCHATTEN_FARBEN[Math.max(0, i) % SCHATTEN_FARBEN.length];
}
const sichtbarePings = () => istSchatten() ? s.pings.filter(p => p.name === s.name) : s.pings;
// „der Schatten“ oder „die Schatten“, je nach Anzahl
const derSchatten = (gross) => mehrereSchatten() ? (gross ? 'Die Schatten' : 'die Schatten') : (gross ? 'Der Schatten' : 'der Schatten');
const jokerVerfuegbar = () => s.belohnungen.find(b => b.rolle === 'schatten' && b.name === s.name && b.gewonnen && !b.eingeloest && b.fake_lat == null);
const jokerGeplant = (name = s.name) => s.belohnungen.find(b => b.rolle === 'schatten' && b.name === name && b.gewonnen && !b.eingeloest && b.fake_lat != null);
const bonusVerfuegbar = () => s.belohnungen.find(b => b.rolle === 'jaeger' && b.gewonnen && !b.eingeloest);

// =====================================================================
// Ton, Vibration, Meldungen
// =====================================================================
let audio = null;
function audioStarten() {
  try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch (e) {}
}
function ton(freq = 880, mal = 1) {
  if (navigator.vibrate) navigator.vibrate([].concat(...Array(mal).fill([250, 120])));
  if (!audio) return;
  try {
    audio.resume();
    for (let i = 0; i < mal; i++) {
      const t = audio.currentTime + i * 0.32;
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = 'sine'; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.5, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
      o.connect(g).connect(audio.destination);
      o.start(t); o.stop(t + 0.3);
    }
  } catch (e) {}
}
function toast(text, warn = false) {
  const el = document.createElement('div');
  el.className = 'toast' + (warn ? ' warn' : '');
  el.textContent = text;
  $('toasts').appendChild(el);
  setTimeout(() => el.remove(), 6000);
}
function hinweis(text) {
  $('hinweis').textContent = text || '';
  $('hinweis').style.display = text ? 'block' : 'none';
}
function modal(html, typ) {
  s.modalTyp = typ;
  $('modalInhalt').innerHTML = html;
  $('modal').hidden = false;
}
const modalUnwichtig = () => s.modalTyp == null || s.modalTyp === 'chat' || s.modalTyp === 'liste';
function modalSchliessen() { $('modal').hidden = true; s.modalTyp = null; }
function bestaetigen(titel, text, okText, fn) {
  modal(`<h2>${esc(titel)}</h2><p class="klein">${esc(text)}</p>
    <div class="zeile"><button id="mNein">Abbrechen</button><button class="haupt" id="mJa">${esc(okText)}</button></div>`, 'frage');
  $('mNein').onclick = modalSchliessen;
  $('mJa').onclick = () => { modalSchliessen(); fn(); };
}

$('schattenTitel').textContent = FLUCHT.emoji + ' ' + FLUCHT.name;
let gewaehlteRolle = 'jaeger';
document.querySelectorAll('.rolle').forEach(b => b.addEventListener('click', () => {
  gewaehlteRolle = b.dataset.rolle;

}));
try {

  $('code').value = localStorage.getItem('hunt-code') || '';
} catch (e) {}
const einladung = new URLSearchParams(location.search).get('code');

$('los').addEventListener('click', async () => {
  const name = $('name').value.trim();
  const code = $('code').value.trim().toLowerCase();
  const fehler = $('startFehler');
  if (!name) { fehler.textContent = 'Gib deinen Namen ein, damit die anderen dich erkennen.'; return; }
  if (!code) { fehler.textContent = 'Gib einen Spielcode ein.'; return; }
  if (!navigator.geolocation) { fehler.textContent = 'Dieser Browser kann keinen Standort liefern.'; return; }
  // Jeder Name darf pro Spiel nur einmal vorkommen
  try {
    const da = await dbGet('spieler', { spiel: 'eq.' + code, name: 'eq.' + name, select: 'rolle,aktualisiert' });
    if (da.length && da[0].rolle !== gewaehlteRolle && Date.parse(da[0].aktualisiert) > jetzt() - 10 * MIN) {
      fehler.textContent = 'Diesen Namen gibt es in diesem Spiel schon. Nimm einen anderen.'; return;
    }
  } catch (e) {}
  try { localStorage.setItem('hunt-name', name); localStorage.setItem('hunt-code', code); } catch (e) {}
  s.rolle = gewaehlteRolle;
  s.name = name;
  s.code = code;
  audioStarten();
  spielBeitreten();
});

// =====================================================================
// Karte
// =====================================================================
let map, ich, zoneLayer, pingLayer, jaegerLayer, aufdeckLayer, jokerLayer, spurLayer;

function karteAufbauen() {
  map = L.map('map', { zoomControl: true }).setView([51.3127, 9.4797], 14);
  L.tileLayer('https://tile.openstreetmap.de/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(map);
  zoneLayer = L.layerGroup().addTo(map);
  pingLayer = L.layerGroup().addTo(map);
  jaegerLayer = L.layerGroup().addTo(map);
  aufdeckLayer = L.layerGroup().addTo(map);
  jokerLayer = L.layerGroup().addTo(map);
  spurLayer = L.layerGroup().addTo(map);
  map.on('click', (e) => {
    if (s.zeichnen) { s.zoneLokal.push([e.latlng.lat, e.latlng.lng]); zeichneZone(); }
    else if (s.jokerModus) jokerSetzen(e.latlng);
  });
  setTimeout(() => map.invalidateSize(), 300);
  window.addEventListener('resize', () => map.invalidateSize());
  $('fabMich').onclick = () => { if (s.position) map.setView(s.position, Math.max(map.getZoom(), 16)); };
}

function zeichneZone() {
  zoneLayer.clearLayers();
  const orig = s.zoneLokal, akt = aktuelleZone();
  if (orig.length >= 3 && akt !== orig) L.polygon(orig, { color: '#2563eb', weight: 2, dashArray: '6 8', fill: false, interactive: false }).addTo(zoneLayer);
  if (akt.length >= 3) L.polygon(akt, { color: '#2563eb', weight: 3, fillOpacity: 0.1, interactive: false }).addTo(zoneLayer);
  else akt.forEach(p => L.circleMarker(p, { radius: 6, color: '#2563eb' }).addTo(zoneLayer));
}

function pingName(p) {
  let n = p.nummer != null ? 'Ping ' + (p.nummer + 1) : 'Bonus-Ping';
  if (istSchatten() && p.art === 'fake') n += ' (Joker)';
  if (p.art === 'zone') n = 'Zonen-Ping';
  if (!istSchatten() && mehrereSchatten() && p.name) n = p.name + ' · ' + n;
  return n;
}
function zeichnePings() {
  pingLayer.clearLayers();
  if (jaegerGesperrt()) return;
  const gruppen = {};
  sichtbarePings().forEach(p => (gruppen[p.name || ''] = gruppen[p.name || ''] || []).push(p));
  Object.entries(gruppen).forEach(([name, liste]) => {
    const f = farbe(name);
    liste.forEach((p, i) => {
      const neuester = i === liste.length - 1;
      const op = neuester ? 1 : 0.3 + 0.5 * (i / Math.max(1, liste.length - 1));
      L.circle([p.lat, p.lng], { radius: 100, color: f, weight: neuester ? 3 : 1, opacity: op, fillOpacity: neuester ? 0.18 : 0.05, interactive: false }).addTo(pingLayer);
      L.circleMarker([p.lat, p.lng], { radius: neuester ? 9 : 6, color: '#fff', weight: 2, fillColor: f, fillOpacity: op })
        .bindTooltip(pingName(p) + ' · ' + uhr(Date.parse(p.erstellt)), { permanent: neuester, direction: 'top', offset: [0, -8], className: 'name' })
        .addTo(pingLayer);
    });
  });
}
function zeichneJaeger() {
  jaegerLayer.clearLayers();
  if (istSchatten() || jaegerGesperrt()) return; // Der Schatten sieht die Jäger nur beim Aufdecken
  // Schatten außerhalb der Zone (oder kurz danach) sind live sichtbar
  if (phase() === 'laeuft') s.spieler.filter(unterStrafe).forEach(p => {
    L.circle([p.lat, p.lng], { radius: 40, color: farbe(p.name), weight: 3, fillOpacity: 0.25, interactive: false }).addTo(jaegerLayer);
    L.circleMarker([p.lat, p.lng], { radius: 10, color: '#fff', weight: 3, fillColor: farbe(p.name), fillOpacity: 1 })
      .bindTooltip(p.name + ' · LIVE', { permanent: true, direction: 'top', offset: [0, -10], className: 'name' }).addTo(jaegerLayer);
  });
  jaegerOnline().filter(j => j.name !== s.name).forEach(j => {
    L.circleMarker([j.lat, j.lng], { radius: 8, color: '#fff', weight: 3, fillColor: '#2f6b4f', fillOpacity: 1 })
      .bindTooltip(j.name, { permanent: true, direction: 'top', offset: [0, -8], className: 'name' }).addTo(jaegerLayer);
  });
}
function zeichneAufdeckung() {
  aufdeckLayer.clearLayers();
  if (!istSchatten() || !s.aufdeckung) return;
  s.aufdeckung.liste.forEach(j => {
    L.circleMarker([j.lat, j.lng], { radius: 8, color: '#fff', weight: 3, fillColor: '#c4861f', fillOpacity: 0.9 })
      .bindTooltip(j.name + ' · ' + uhr(s.aufdeckung.zeit), { permanent: true, direction: 'top', offset: [0, -8], className: 'name aufgedeckt' })
      .addTo(aufdeckLayer);
  });
}
function zeichneJoker() {
  jokerLayer.clearLayers();
  if (!istSchatten()) return;
  if (s.jokerModus && s.position) L.circle(s.position, { radius: JOKER_RADIUS_M, color: '#c4861f', weight: 2, dashArray: '6 8', fillOpacity: 0.05, interactive: false }).addTo(jokerLayer);
  const g = jokerGeplant();
  if (g) L.circleMarker([g.fake_lat, g.fake_lng], { radius: 9, color: '#c4861f', weight: 3, dashArray: '3 3', fillOpacity: 0 })
    .bindTooltip('Dein Joker', { permanent: true, direction: 'top', offset: [0, -8], className: 'name aufgedeckt' }).addTo(jokerLayer);
}

// =====================================================================
// GPS und Bildschirm wach halten
// =====================================================================
function gpsStarten() {
  navigator.geolocation.watchPosition((pos) => {
    s.gpsFehler = null;
    s.position = [pos.coords.latitude, pos.coords.longitude];
    if (!ich) ich = L.circleMarker(s.position, { radius: 9, color: '#fff', weight: 3, fillColor: '#2563eb', fillOpacity: 1 }).addTo(map);
    else ich.setLatLng(s.position);
    ich.bringToFront();
    if (!s.zentriert) { map.setView(s.position, 16); s.zentriert = true; }
  }, (err) => {
    s.gpsFehler = err.code === 1 ? 'Standort blockiert – in den Einstellungen erlauben' : 'Kein GPS-Signal';
  }, { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 });
}
async function wachHalten() {
  try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch (e) {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { wachHalten(); audioStarten(); if (map) sync(); }
});

// =====================================================================
// Abgleich mit dem Server
// =====================================================================
let syncLaeuft = false;
async function sync() {
  if (syncLaeuft) return;
  syncLaeuft = true;
  try {
    if (s.position && phase() !== 'ende') {
      const zeile = { spiel: s.code, name: s.name, rolle: s.rolle, lat: s.position[0], lng: s.position[1], aktualisiert: iso() };
      if (istSchatten() && s.strafeBis > jetzt()) zeile.strafe_bis = iso(s.strafeBis);
      await dbUpsert('spieler', zeile, 'spiel,name');
    }
    const [spiele, spieler, pings, bel, meine, chat] = await Promise.all([
      dbGet('spiele', { code: 'eq.' + s.code }),
      dbGet('spieler', { spiel: 'eq.' + s.code, select: 'name,rolle,lat,lng,aktualisiert,gefasst,fang_von,strafe_bis' }),
      dbGet('pings', { spiel: 'eq.' + s.code, order: 'erstellt.asc', select: 'id,nummer,art,name,lat,lng,erstellt' }),
      dbGet('belohnungen', { spiel: 'eq.' + s.code }),
      dbGet('antworten', { spiel: 'eq.' + s.code, name: 'eq.' + s.name, select: 'runde' }),
      dbGet('chat', { spiel: 'eq.' + s.code, kanal: 'eq.' + meinKanal(), id: 'gt.' + s.chatLetzteId, order: 'id.asc', select: 'id,name,text,audio,erstellt' })
    ]);
    neueNachrichten(chat);
    s.spiel = spiele[0] || null;
    neueFaengeMelden(spieler);
    s.spieler = spieler;
    neuePingsMelden(pings);
    s.pings = pings;
    neueBelohnungenMelden(bel);
    s.belohnungen = bel;
    s.meineRunden = new Set(meine.map(a => a.runde));
    if (s.spiel && !s.zeichnen && jetzt() > s.zoneSperreBis) {
      const z = s.spiel.zone || [];
      if (JSON.stringify(z) !== JSON.stringify(s.zoneLokal)) s.zoneLokal = z;
    }
    if (phase() === 'laeuft') {
      await spielLogik();
      if (!binGefasst() && s.position && jetzt() - s.letzteSpur > SPUR_S * 1000) {
        s.letzteSpur = jetzt();
        await dbInsert('spur', { spiel: s.code, name: s.name, rolle: s.rolle, lat: s.position[0], lng: s.position[1] });
      }
    }
    s.online = true;
  } catch (e) {
    console.warn('Sync-Fehler', e);
    s.online = false;
  }
  s.ersterSync = false;
  syncLaeuft = false;
  zeichneZone(); zeichnePings(); zeichneJaeger(); zeichneJoker();
  render();
}

function neuePingsMelden(neu) {
  if (s.ersterSync) return;
  const alt = new Set(s.pings.map(p => p.id));
  const frisch = neu.filter(p => !alt.has(p.id) && (!istSchatten() || p.name === s.name));
  const gemeldet = new Set(); // Pings mehrerer Schatten zur selben Zeit nur einmal melden
  frisch.forEach(p => {
    const art = p.art === 'bonus' ? 'bonus' : p.art === 'zone' ? 'zone' + p.name : 'n' + p.nummer;
    if (gemeldet.has(art)) return;
    gemeldet.add(art);
    if (p.art === 'zone') {
      if (istSchatten()) toast('Du bist außerhalb der Zone – die Jäger sehen dich jetzt live!', true);
      else toast(`${p.name} hat die Zone verlassen und ist live sichtbar!`);
      ton(istSchatten() ? 440 : 880, 3);
    } else if (p.art === 'bonus') {
      if (istSchatten()) { toast('Die Jäger haben einen Bonus-Ping eingesetzt – lauf!', true); ton(440, 3); }
      else { toast('Bonus-Ping: So sieht es gerade aus!'); ton(880, 2); }
    } else if (istSchatten() && p.art === 'fake') {
      toast('Dein Joker wurde als Ping gesendet'); ton(660, 1);
    } else {
      toast('Ping ' + (p.nummer + 1) + ' ist da!', istSchatten()); ton(880, 2);
    }
  });
}
function neueFaengeMelden(neu) {
  if (s.ersterSync) return;
  const vorher = new Set(s.spieler.filter(p => p.gefasst).map(p => p.name));
  const offen = neu.filter(p => p.rolle === 'schatten' && !p.gefasst).length;
  neu.filter(p => p.rolle === 'schatten' && p.gefasst && !vorher.has(p.name)).forEach(p => {
    if (p.name === s.name) toast('Du wurdest gefasst und bist raus.', true);
    else toast(`${p.name} wurde gefasst!` + (offen ? ` Noch ${offen} Schatten frei.` : ''), istSchatten());
    ton(istSchatten() ? 440 : 990, 2);
  });
}
function neueBelohnungenMelden(neu) {
  if (s.ersterSync) return;
  const schl = (b) => b.runde + b.rolle + (b.name || '');
  const alt = new Set(s.belohnungen.map(schl));
  const meine = (b) => istSchatten() ? (b.rolle === 'schatten' && b.name === s.name) : b.rolle === 'jaeger';
  neu.filter(b => meine(b) && !alt.has(schl(b))).forEach(b => {
    if (istSchatten()) toast(b.gewonnen ? 'Richtig! Du hast einen Joker für einen falschen Ping.' : 'Leider falsch – kein Joker.', !b.gewonnen);
    else toast(b.gewonnen ? 'Alle richtig! Ihr habt einen Bonus-Ping.' : 'Nicht alle lagen richtig – kein Bonus-Ping.', !b.gewonnen);
    ton(b.gewonnen ? 990 : 330, 1);
  });
}

// Pings erzeugen und Rätsel auswerten – das erledigt jedes Handy, das gerade offen ist.
async function spielLogik() {
  const st = startMs();
  const vorhanden = new Set(s.pings.filter(p => p.nummer != null).map(p => p.nummer + '|' + p.name));
  for (const k of faelligePingNrs()) {
    // Jeder Schatten, der zum Ping-Zeitpunkt noch frei war, bekommt einen eigenen Ping
    for (const sch of alleSchatten()) {
      if (vorhanden.has(k + '|' + sch.name)) continue;
      if (sch.gefasst && Date.parse(sch.gefasst) <= pingZeit(k)) continue;
      const joker = jokerGeplant(sch.name);
      const daten = { spiel: s.code, nummer: k, name: sch.name, art: joker ? 'fake' : 'normal',
        lat: joker ? joker.fake_lat : sch.lat, lng: joker ? joker.fake_lng : sch.lng };
      const ergebnis = await dbInsertIgnorieren('pings', daten, 'spiel,nummer,name');
      if (joker && ergebnis && ergebnis.length) {
        await dbPatch('belohnungen', { spiel: 'eq.' + s.code, runde: 'eq.' + joker.runde, rolle: 'eq.schatten', name: 'eq.' + sch.name }, { eingeloest: true });
      }
    }
  }
  // Alle Schatten gefasst? Dann ist das Spiel vorbei
  const schatten = alleSchatten();
  if (schatten.length && schatten.every(p => p.gefasst)) {
    const letzter = Math.max(...schatten.map(p => Date.parse(p.gefasst)));
    await dbPatch('spiele', { code: 'eq.' + s.code, status: 'eq.laeuft' }, { status: 'gefasst', ende: iso(letzter) });
  }
  for (let i = 0; i < RAETSEL_MIN.length; i++) {
    const t0 = st + RAETSEL_MIN[i] * MIN, t1 = t0 + RAETSEL_DAUER_S * 1000;
    if (jetzt() < t1 || s.ausgewertet.has(i) || s.belohnungen.some(b => b.runde === i)) continue;
    s.ausgewertet.add(i);
    const [antworten, jaeger] = await Promise.all([
      dbGet('antworten', { spiel: 'eq.' + s.code, runde: 'eq.' + i }),
      dbGet('spieler', { spiel: 'eq.' + s.code, rolle: 'eq.jaeger', aktualisiert: 'gte.' + iso(t0 - JAEGER_TIMEOUT_S * 1000), select: 'name' })
    ]);
    const jaegerOk = jaeger.length > 0 && jaeger.every(j => antworten.some(a => a.name === j.name && a.richtig));
    // Jeder Schatten, der beim Rätsel noch frei war, bekommt bei richtiger Antwort seinen eigenen Joker
    const zeilen = [{ spiel: s.code, runde: i, rolle: 'jaeger', name: '', gewonnen: jaegerOk }];
    alleSchatten().filter(p => !p.gefasst || Date.parse(p.gefasst) > t0).forEach(p => {
      zeilen.push({ spiel: s.code, runde: i, rolle: 'schatten', name: p.name, gewonnen: antworten.some(a => a.name === p.name && a.richtig) });
    });
    await dbInsertIgnorieren('belohnungen', zeilen, 'spiel,runde,rolle,name');
  }
}

// =====================================================================
// Ereignisse im Sekundentakt
// =====================================================================
function einmal(schluessel, zeitpunkt, fn) {
  if (s.gemeldet.has(schluessel)) return;
  const n = jetzt();
  if (n >= zeitpunkt) { s.gemeldet.add(schluessel); if (n < zeitpunkt + 60000) fn(); }
}

function tick() {
  const ph = phase();
  if (ph === 'laeuft') {
    const st = startMs();
    einmal('start', st, () => { toast(istSchatten() ? `Los! Du hast ${vorsprungText()} Minuten Vorsprung.` : `Das Spiel läuft – ${derSchatten(false)} ${mehrereSchatten() ? 'haben' : 'hat'} ${vorsprungText()} Minuten Vorsprung.`); ton(660, 2); });
    einmal('jagd', st + VORSPRUNG_MIN * MIN, () => { toast('Die Jagd beginnt!', true); ton(880, 3); });
    if (istSchatten() && !binGefasst()) {
      const k = naechsterPingNr();
      if (k != null) einmal('warn' + k, pingZeit(k) - MIN, () => { toast('Achtung: Ping in 1 Minute!', true); ton(660, 2); });
    }
    RAETSEL_MIN.forEach((m, i) => {
      const t0 = st + m * MIN, t1 = t0 + RAETSEL_DAUER_S * 1000;
      if (jetzt() >= t0 && jetzt() < t1 && !s.meineRunden.has(i) && !binGefasst() && modalUnwichtig()) raetselZeigen(i, t1);
    });
    AUFDECKEN_MIN.forEach((m, i) => einmal('auf' + i, st + m * MIN, aufdecken));
    SCHRUMPF.forEach((z, i) => einmal('schrumpf' + i, st + z.min * MIN, () => { toast(`Die Zone schrumpft auf ${Math.round(z.faktor * 100)} %!`, true); ton(550, 2); zeichneZone(); }));
    zonenStrafe();
    const meiner = meinEintrag();
    if (istSchatten() && meiner && !meiner.gefasst && meiner.fang_von && meiner.fang_von !== s.fangAbgelehnt && modalUnwichtig()) fangBestaetigen(meiner.fang_von);
    if (meiner && !meiner.fang_von) s.fangAbgelehnt = null;
  }
  if (ph === 'ende') {
    if (s.spiel.status === 'laeuft' && !s.gemeldet.has('endePatch')) {
      s.gemeldet.add('endePatch');
      dbPatch('spiele', { code: 'eq.' + s.code, status: 'eq.laeuft' }, { status: 'entkommen', ende: iso(endeMs()) }).catch(() => {});
    }
    if (!s.gemeldet.has('ende') && (s.modalTyp == null || s.modalTyp === 'raetsel')) {
      s.gemeldet.add('ende');
      endeZeigen();
    }
  }
  render();
}

function aufdecken() {
  if (binGefasst()) return;
  if (istSchatten()) {
    s.aufdeckung = { zeit: jetzt(), liste: jaegerOnline() };
    zeichneAufdeckung();
    toast('Jäger aufgedeckt! So standen sie gerade.', false);
    ton(990, 2);
  } else {
    toast(`${derSchatten(true)} ${mehrereSchatten() ? 'haben' : 'hat'} eure Positionen gerade gesehen!`, true);
    ton(440, 2);
  }
}

function raetselZeigen(i, t1) {
  const idx = (s.spiel.raetsel && s.spiel.raetsel[i] != null) ? s.spiel.raetsel[i] : i;
  const r = RAETSEL[idx % RAETSEL.length];
  s.raetselEnde = t1;
  ton(880, 2);
  const erklaerung = istSchatten()
    ? 'Richtig beantwortet bekommst du deinen eigenen Joker: Du darfst einen falschen Ping setzen.'
    : 'Nur wenn alle Jäger richtig antworten, bekommt ihr einen Bonus-Ping.';
  modal(`<h2>Rätsel ${i + 1}</h2><p class="frage">${esc(r.frage)}</p>
    <p class="klein">${erklaerung} Noch <b id="rRest">${mmss(t1 - jetzt())}</b>.</p>
    <div class="antworten">${r.antworten.map((a, j) => `<button data-j="${j}">${esc(a)}</button>`).join('')}</div>`, 'raetsel');
  document.querySelectorAll('.antworten button').forEach(b => b.onclick = async () => {
    const antwort = r.antworten[+b.dataset.j];
    document.querySelectorAll('.antworten button').forEach(x => x.disabled = true);
    try {
      await dbUpsert('antworten', { spiel: s.code, runde: i, name: s.name, rolle: s.rolle, antwort, richtig: antwort === r.richtig }, 'spiel,runde,name');
      s.meineRunden.add(i);
      modalSchliessen();
      toast('Antwort gespeichert – die Auflösung kommt, wenn die Zeit um ist.');
    } catch (e) {
      toast('Antwort nicht gespeichert – keine Verbindung. Nochmal versuchen.', true);
      document.querySelectorAll('.antworten button').forEach(x => x.disabled = false);
    }
  });
}

      + (gefangen.length ? 'Gefasst: ' + gefangen.map(p => `${esc(p.name)} (nach ${minuten(p)} Min.)`).join(', ') + '.' : '');

  $('mZu').onclick = modalSchliessen;
  $('mStat').onclick = statistikZeigen;

async function routeAbspielen() {
  modalSchliessen();
  try {
    const spur = await dbGet('spur', { spiel: 'eq.' + s.code, order: 'zeit.asc', select: 'name,rolle,lat,lng,zeit' });
    if (spur.length < 2) { toast('Zu wenig Daten für eine Route'); return; }
    spurLayer.clearLayers();
    map.fitBounds(L.latLngBounds(spur.map(p => [p.lat, p.lng])).pad(0.2));
    const routen = {};
    spur.forEach(p => (routen[p.name || ''] = routen[p.name || ''] || []).push(p));
    const t0 = Date.parse(spur[0].zeit), t1 = Date.parse(spur[spur.length - 1].zeit);
    const bahnen = Object.entries(routen).map(([name, pkte]) => {
      const jaeger = pkte[0].rolle === 'jaeger';
      const f = jaeger ? '#2f6b4f' : farbe(name);
      return {
        name, pkte,
        linie: L.polyline([], { color: f, weight: jaeger ? 3 : 4, opacity: jaeger ? 0.75 : 1 }).addTo(spurLayer),
        kopf: L.circleMarker([pkte[0].lat, pkte[0].lng], { radius: jaeger ? 7 : 9, color: '#fff', weight: 3, fillColor: f, fillOpacity: 1 })
          .bindTooltip('', { permanent: true, direction: 'top', offset: [0, -10], className: 'name' }).addTo(spurLayer)
      };
    });
    const ruhig = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const dauer = ruhig ? 1 : 15000, beginn = performance.now();
    const schritt = (t) => {
      const f = Math.min(1, (t - beginn) / dauer);
      const bis = t0 + f * (t1 - t0); // alle Routen laufen zeitgleich ab
      bahnen.forEach(b => {
        const sichtbar = b.pkte.filter(p => Date.parse(p.zeit) <= bis);
        if (!sichtbar.length) return;
        const letzter = sichtbar[sichtbar.length - 1];
        b.linie.setLatLngs(sichtbar.map(p => [p.lat, p.lng]));
        b.kopf.setLatLng([letzter.lat, letzter.lng]);
        b.kopf.setTooltipContent((b.pkte[0].rolle === 'jaeger' ? '🔎 ' : FLUCHT.emoji + ' ') + esc(b.name || '') + ' · ' + uhr(Date.parse(letzter.zeit)));
      });
      if (f < 1) requestAnimationFrame(schritt);
    };
    requestAnimationFrame(schritt);
  } catch (e) { toast('Route konnte nicht geladen werden', true); }
}

function zonenStrafe() {
  if (!istSchatten() || binGefasst()) return;
  if (binDraussen()) {
    s.strafeBis = jetzt() + STRAFE_S * 1000;
    if (!s.strafeAktiv) {
      s.strafeAktiv = true;
      dbInsert('pings', { spiel: s.code, art: 'zone', name: s.name, lat: s.position[0], lng: s.position[1] }).catch(() => {});
      sync();
    }
  } else if (s.strafeAktiv && jetzt() >= s.strafeBis) {
    s.strafeAktiv = false;
    toast('Strafe vorbei – du bist wieder unsichtbar.');
  }
}

function neueNachrichten(neu) {
  if (!neu.length) return;
  s.chatLetzteId = neu[neu.length - 1].id;
  s.chat.push(...neu);
  if (s.ersterSync) { s.chatGelesen = s.chatLetzteId; return; }
  neu.filter(n => n.name !== s.name).forEach(n => {
    if (n.audio) {
      if (jaegerGesperrt()) return; // außerhalb der Zone hört man den Funk nicht
      sprachAbspielen(n.audio);
      toast(`🎙️ ${n.name} funkt…`);
    } else if (s.modalTyp !== 'chat') {
      toast(`💬 ${n.name}: ${n.text.slice(0, 80)}`);
      ton(1200, 1);
    }
  });
  if (s.modalTyp === 'chat') { s.chatGelesen = s.chatLetzteId; chatListeZeichnen(); }
}
function chatListeZeichnen() {
  const box = $('chatListe');
  if (!box) return;
  box.innerHTML = s.chat.length ? s.chat.map(n => `<div class="nachricht${n.name === s.name ? ' meine' : ''}">
      <small>${esc(n.name)} · ${uhr(Date.parse(n.erstellt))}</small>
      ${n.audio ? `<button data-audio="${esc(n.audio)}">▶︎ Sprachnachricht</button>` : esc(n.text)}</div>`).join('')
    : '<p class="klein">Noch keine Nachrichten.</p>';
  box.querySelectorAll('button[data-audio]').forEach(b => b.onclick = () => {
    if (jaegerGesperrt()) { toast('Außerhalb der Zone ist der Funk gesperrt', true); return; }
    sprachAbspielen(b.dataset.audio);
  });
  box.scrollTop = box.scrollHeight;
}
function chatOeffnen() {
  const titel = istSchatten() ? 'Chat der Schatten' : 'Chat der Jäger';
  modal(`<h2>${titel}</h2><div class="chatliste" id="chatListe"></div>
    <div class="chateingabe"><input id="chatText" maxlength="300" placeholder="Nachricht…" enterkeyhint="send"><button id="chatSenden">Senden</button></div>
    <div class="zeile"><button id="mZu">Schließen</button></div>`, 'chat');
  s.chatGelesen = s.chatLetzteId;
  chatListeZeichnen();
  const senden = async () => {
    const text = $('chatText').value.trim();
    if (!text) return;
    $('chatText').value = '';
    try { await dbInsert('chat', { spiel: s.code, name: s.name, rolle: s.rolle, kanal: meinKanal(), text }); await sync(); }
    catch (e) { toast('Nachricht nicht gesendet – keine Verbindung', true); $('chatText').value = text; }
  };
  $('chatSenden').onclick = senden;
  $('chatText').onkeydown = (e) => { if (e.key === 'Enter') senden(); };

// Funk: Sprachnachrichten nacheinander abspielen
let funkKette = Promise.resolve();
function sprachAbspielen(url) {
  funkKette = funkKette.then(async () => {
    try {
      audioStarten();
      const daten = await (await fetch(url)).arrayBuffer();
      const puffer = await audio.decodeAudioData(daten);
      await new Promise(fertig => {
        const quelle = audio.createBufferSource();
        quelle.buffer = puffer; quelle.connect(audio.destination);
        quelle.onended = fertig; quelle.start();
      });
    } catch (e) { console.warn('Abspielen', e); toast('Sprachnachricht konnte nicht abgespielt werden', true); }
  });
}
let funkStream = null, funkRec = null, funkTeile = [], funkBeginn = 0, funkTimer = null;
async function funkDruecken(e) {
  e.preventDefault();
  if (funkRec || jaegerGesperrt()) return;
  s.funkGedrueckt = true;
  audioStarten();
  try {
    if (!funkStream) funkStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (err) { s.funkGedrueckt = false; toast('Mikrofon nicht erlaubt – in den Einstellungen freigeben', true); return; }
  if (!s.funkGedrueckt) { toast('Mikrofon bereit – jetzt gedrückt halten und sprechen'); return; }
  const typ = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm'].find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || '';
  funkTeile = [];
  funkRec = new MediaRecorder(funkStream, typ ? { mimeType: typ } : undefined);
  funkRec.ondataavailable = (ev) => { if (ev.data.size) funkTeile.push(ev.data); };
  funkRec.onstop = funkSenden;
  funkRec.start();
  funkBeginn = jetzt();
  s.funkAn = true;
  funkTimer = setTimeout(funkLoslassen, FUNK_MAX_S * 1000);
  render();
}
function funkLoslassen() {
  s.funkGedrueckt = false;
  clearTimeout(funkTimer);
  if (funkRec && funkRec.state === 'recording') funkRec.stop();
}
async function funkSenden() {
  const rec = funkRec, dauer = jetzt() - funkBeginn;
  funkRec = null; s.funkAn = false;
  // Mikrofon wieder freigeben, damit der Ton normal über den Lautsprecher läuft
  if (funkStream) { funkStream.getTracks().forEach(tr => tr.stop()); funkStream = null; }
  render();
  if (dauer < 700) { toast('Zu kurz – Knopf gedrückt halten, während du sprichst'); return; }
  const typ = (rec && rec.mimeType) || 'audio/mp4';
  const blob = new Blob(funkTeile, { type: typ });
  const pfad = `${encodeURIComponent(s.code)}/${jetzt()}-${Math.random().toString(36).slice(2, 8)}.${typ.includes('webm') ? 'webm' : 'm4a'}`;
  try {
    const r = await fetch(`${SUPABASE_URL}/storage/v1/object/funk/${pfad}`, { method: 'POST', headers: { apikey: SUPABASE_KEY, 'Content-Type': typ.split(';')[0] }, body: blob });
    if (!r.ok) throw new Error(r.status + ' ' + await r.text());
    await dbInsert('chat', { spiel: s.code, name: s.name, rolle: s.rolle, kanal: meinKanal(), text: '', audio: `${SUPABASE_URL}/storage/v1/object/public/funk/${pfad}` });
    toast('Funkspruch gesendet');
    await sync();
  } catch (e) { console.warn('Funk', e); toast('Funkspruch nicht gesendet – keine Verbindung', true); }
}
$('funkKnopf').addEventListener('pointerdown', funkDruecken);
['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => $('funkKnopf').addEventListener(ev, funkLoslassen));
$('funkKnopf').addEventListener('contextmenu', (e) => e.preventDefault());
$('chatKnopf').addEventListener('click', chatOeffnen);

function renderFunkzeile(ph) {
  const chat = $('chatKnopf'), funk = $('funkKnopf');
  chat.hidden = !chatMoeglich();
  const ungelesen = s.chat.filter(n => n.id > s.chatGelesen && n.name !== s.name).length;
  chat.textContent = ungelesen ? `💬 Chat (${ungelesen})` : '💬 Chat';
  chat.className = ungelesen ? 'rot' : 'grau';
  funk.hidden = istSchatten() || ph === 'ende';
  const gesperrt = jaegerGesperrt();
  funk.disabled = gesperrt;
  funk.classList.toggle('an', s.funkAn);
  funk.textContent = gesperrt ? '🎙️ Funk gesperrt' : s.funkAn ? `● ${Math.round((jetzt() - funkBeginn) / 1000)} s – loslassen` : '🎙️ Halten zum Funken';
}

// =====================================================================
// Einladen und Statistik
// =====================================================================
async function einladen() {
  const url = location.origin + location.pathname + '?code=' + encodeURIComponent(s.code);
  try {
    if (navigator.share) await navigator.share({ title: 'The Hunt', text: `Spiel mit bei The Hunt! Spielcode: ${s.code}`, url });
    else { await navigator.clipboard.writeText(url); toast('Einladungslink kopiert'); }
  } catch (e) { /* Teilen abgebrochen */ }
}

function streckeKm(pkte) {
  let m = 0;
  for (let i = 1; i < pkte.length; i++) {
    const d = abstandM([pkte[i - 1].lat, pkte[i - 1].lng], [pkte[i].lat, pkte[i].lng]);
    if (d > 10) m += d; // kleine GPS-Zitterer nicht mitzählen
  }
  return m / 1000;
}
const zahl = (x, n = 1) => x.toLocaleString('de-DE', { minimumFractionDigits: n, maximumFractionDigits: n });
async function statistikZeigen() {
  try {
    const spur = await dbGet('spur', { spiel: 'eq.' + s.code, order: 'zeit.asc', select: 'name,rolle,lat,lng,zeit' });
    const routen = {};
    spur.forEach(p => (routen[p.name] = routen[p.name] || []).push(p));
    const daten = Object.entries(routen).map(([name, pkte]) => {
      const km = streckeKm(pkte);
      const std = (Date.parse(pkte[pkte.length - 1].zeit) - Date.parse(pkte[0].zeit)) / 3600000;
      return { name, rolle: pkte[0].rolle, pkte, km, tempo: std > 0.05 ? km / std : 0 };
    });
    const schatten = daten.filter(d => d.rolle !== 'jaeger'), jaeger = daten.filter(d => d.rolle === 'jaeger');
    // Knappste Begegnung: kleinster Abstand Jäger–Schatten zur (ungefähr) gleichen Zeit
    const knapp = (sch) => {
      let best = null;
      sch.pkte.forEach(a => jaeger.forEach(j => j.pkte.forEach(b => {
        if (Math.abs(Date.parse(a.zeit) - Date.parse(b.zeit)) > 30000) return;
        const d = abstandM([a.lat, a.lng], [b.lat, b.lng]);
        if (!best || d < best.d) best = { d, wer: j.name, zeit: Date.parse(a.zeit) };
      })));
      return best;
    };
    const weitester = [...daten].sort((a, b) => b.km - a.km)[0];
    const eintrag = (name) => s.spieler.find(p => p.name === name) || {};
    let html = '<h2>Statistik</h2><div class="stat">';
    if (weitester) html += `<div>🏅 Am weitesten gelaufen: <b>${esc(weitester.name)}</b> mit <b class="gross">${zahl(weitester.km, 2)} km</b></div>`;
    html += '<h3>🌑 Schatten</h3>';
    schatten.forEach(d => {
      const e = eintrag(d.name), k = knapp(d);
      const pings = s.pings.filter(p => p.name === d.name).length;
      const status = e.gefasst ? `gefasst nach ${Math.round((Date.parse(e.gefasst) - startMs()) / MIN)} Min.` : 'entkommen';
      html += `<div><b style="color:${farbe(d.name)}">${esc(d.name)}</b> · ${status}<br>
        <b class="gross">${zahl(d.km, 2)} km</b> · ⌀ ${zahl(d.tempo)} km/h · ${pings} Pings`
        + (k ? `<br>Knappste Begegnung: ${esc(k.wer)} auf <b>${Math.round(k.d)} m</b> (Minute ${Math.round((k.zeit - startMs()) / MIN)})` : '') + '</div>';
    });
    if (jaeger.length) {
      html += '<h3>🔎 Jäger</h3>';
      jaeger.sort((a, b) => b.km - a.km).forEach(d => {
        html += `<div><b>${esc(d.name)}</b> · <b class="gross">${zahl(d.km, 2)} km</b> · ⌀ ${zahl(d.tempo)} km/h</div>`;
      });
    }
    if (!daten.length) html += '<div>Für dieses Spiel wurden keine Routen gespeichert.</div>';
    html += '</div><div class="zeile"><button id="mZu">Schließen</button><button class="haupt" id="mRoute">Route abspielen</button></div>';
    modal(html, 'liste');
    $('mZu').onclick = modalSchliessen;
    $('mRoute').onclick = routeAbspielen;
  } catch (e) { toast('Statistik konnte nicht geladen werden', true); }
}

// =====================================================================
// Anzeige
// =====================================================================
function render() {
  const ph = phase();
  $('wer').textContent = (istSchatten() ? FLUCHT.emoji + ' ' : '🔎 ') + s.name + ' · ' + s.code;
  let gross = '–';
  const infos = [];
  if (ph === 'lobby') {
    gross = 'Lobby';
    infos.push(istSchatten() ? 'Zeichne die Zone und starte, wenn alle da sind' : 'Warte, bis ein Schatten das Spiel startet');
  } else if (ph === 'laeuft' && binGefasst()) {
    gross = mmss(endeMs() - jetzt());
    infos.push('Du wurdest gefasst – schau zu, bis das Spiel endet');
  } else if (ph === 'laeuft') {
    const vorsprungEnde = startMs() + VORSPRUNG_MIN * MIN;
    if (jetzt() < vorsprungEnde) {
      gross = mmss(vorsprungEnde - jetzt());
      infos.push(istSchatten() ? 'Vorsprung – lauf!' : 'Die Jagd beginnt gleich');
    } else {
      gross = mmss(endeMs() - jetzt());
      const k = naechsterPingNr();
      infos.push(k != null ? 'Nächster Ping in ' + mmss(pingZeit(k) - jetzt()) : 'Kein Ping mehr bis zum Ende');
    }
  } else {
    gross = 'Ende';
  }
  const anzahl = jaegerOnline().length;
  const sch = alleSchatten().length, frei = freieSchatten().length;
  if (ph === 'lobby') infos.push(sch + ' Schatten');
  else if (sch) infos.push(frei === sch ? sch + ' Schatten frei' : `${frei} von ${sch} Schatten frei`);
  infos.push(anzahl === 1 ? '1 Jäger online' : anzahl + ' Jäger online');

  let html = infos.map(t => `<span>${esc(t)}</span>`).join('');
  const z = aktuelleZone();
  if (s.position && z.length >= 3 && ph !== 'ende' && !binGefasst()) {
    const drin = punktInPolygon(s.position, z);
    if (drin && istSchatten() && s.strafeBis > jetzt() && ph === 'laeuft') html += `<span class="warn">Noch ${mmss(s.strafeBis - jetzt())} live sichtbar</span>`;
    else if (drin) html += '<span class="ok">In der Zone</span>';
    else if (ph !== 'laeuft') html += '<span class="warn">Außerhalb der Zone!</span>';
    else html += istSchatten() ? '<span class="warn">Außerhalb der Zone – die Jäger sehen dich live!</span>' : '<span class="warn">Außerhalb der Zone – keine Pings, kein Funk!</span>';
  }
  if (!istSchatten() && ph === 'laeuft') s.spieler.filter(unterStrafe).forEach(p => { html += `<span class="warn">${esc(p.name)} ist live sichtbar</span>`; });
  if (istSchatten() && jokerGeplant()) html += '<span class="ok">Joker bereit: nächster Ping ist falsch</span>';
  if (!istSchatten() && bonusVerfuegbar() && ph === 'laeuft') html += '<span class="ok">Bonus-Ping verfügbar</span>';
  if (s.gpsFehler) html += `<span class="warn">${esc(s.gpsFehler)}</span>`;
  else if (!s.position) html += '<span>Suche GPS-Signal…</span>';
  if (!s.online) html += '<span class="warn">Keine Verbindung zum Server</span>';
  $('uhr').textContent = gross;
  $('infos').innerHTML = html;

  if (s.modalTyp === 'raetsel') {
    if (jetzt() >= s.raetselEnde) { modalSchliessen(); toast('Zeit abgelaufen – keine Antwort zählt als falsch', true); }
    else if ($('rRest')) $('rRest').textContent = mmss(s.raetselEnde - jetzt());
  }
  renderKnoepfe(ph);
  renderFunkzeile(ph);
  renderPushKnopf();
}

function renderKnoepfe(ph) {
  let knoepfe;
  if (ph === 'lobby') {
    knoepfe = [
      [s.zeichnen ? 'Zone fertig' : 'Zone zeichnen', 'blau' + (s.zeichnen ? ' aktiv' : ''), zoneUmschalten],
      ['Zone löschen', 'grau', zoneLoeschen],
      ['Einladen', 'grau', einladen]
    ];
    if (istSchatten()) knoepfe.push(['Spiel starten', 'rot', spielStarten, s.zeichnen]);
  } else if (ph === 'laeuft' && binGefasst()) {
    knoepfe = [['Pings', 'grau', pingListe]];
  } else if (ph === 'laeuft') {
    knoepfe = istSchatten()
      ? [['Pings', 'grau', pingListe],
         s.jokerModus ? ['Abbrechen', 'blau aktiv', jokerAbbrechen] : ['Joker', 'blau', jokerStarten, !jokerVerfuegbar()],
         ['Gefasst', 'rot', gefasstSchatten]]
      : [['Pings', 'grau', pingListe],
         ['Bonus-Ping', 'blau', bonusPing, !bonusVerfuegbar()],
         ['Gefasst!', 'rot', gefasstMelden]];
  } else {
    knoepfe = [['Statistik', 'grau', statistikZeigen], ['Route', 'blau', routeAbspielen], ['Neues Spiel', 'rot', () => location.reload()]];
  }
  const schluessel = JSON.stringify(knoepfe.map(k => [k[0], k[1], !!k[3]]));
  if (schluessel === s.knopfSchluessel) return;
  s.knopfSchluessel = schluessel;
  const box = $('knoepfe');
  box.innerHTML = '';
  knoepfe.forEach(([text, klasse, fn, aus]) => {
    const b = document.createElement('button');
    b.textContent = text; b.className = klasse; b.disabled = !!aus; b.onclick = fn;
    box.appendChild(b);
  });
}

// =====================================================================
// Start
// =====================================================================
async function spielBeitreten() {
  $('start').style.display = 'none';
  $('spiel').style.display = 'block';
  karteAufbauen();
  gpsStarten();
  wachHalten();
  render();
  try { await dbInsertIgnorieren('spiele', { code: s.code }, 'code'); } catch (e) { console.warn(e); }
  if (pushStatus() === 'an') pushAboSpeichern().catch(e => console.warn('Push-Abo', e));
  await sync();
  // Ereignisse, die beim Beitreten schon vorbei sind, nicht nochmal melden
  if (phase() !== 'lobby') {
    const st = startMs();
    ['start'].forEach(k => s.gemeldet.add(k));
    SCHRUMPF.forEach((z, i) => { if (jetzt() > st + z.min * MIN + 60000) s.gemeldet.add('schrumpf' + i); });
    if (jetzt() > st + VORSPRUNG_MIN * MIN) s.gemeldet.add('jagd');
  }
  setInterval(sync, SYNC_S * 1000);
  setInterval(tick, 1000);
}
